<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  </head>
  <body>
    <script>
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${protocol}//${location.host}/ws`);

      const players = new Map();
      let scene;
      let myId = null;
      let lastDx = 0,
        lastDy = 0;
      const SPEED = 150;
      const WIDTH = 800,
        HEIGHT = 600,
        HALF = 10;

      ws.onopen = () => {
        console.log("WebSocket connected");
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        switch (data.type) {
          case "connected":
            myId = data.id;
            ws.send(JSON.stringify({ type: "join", room: "room-1" }));
            break;

          case "state":
            data.players.forEach((p) => {
              if (!players.has(p.id)) {
                const color = randomColor();
                const r = scene.add.rectangle(p.x, p.y, 20, 20, color);
                players.set(p.id, { obj: r, x: p.x, y: p.y });
              }
              const pl = players.get(p.id);
              pl.x = p.x;
              pl.y = p.y;
            });
            break;
        }
      };

      ws.onclose = () => {
        console.log("WebSocket disconnected");
      };

      function randomColor() {
        return Math.floor(Math.random() * 0xffffff);
      }

      new Phaser.Game({
        type: Phaser.AUTO,
        width: WIDTH,
        height: HEIGHT,
        backgroundColor: "#1e1e1e",
        scene: {
          create() {
            scene = this;
            this.cursors = this.input.keyboard.createCursorKeys();
          },
          update(time, delta) {
            let dx = 0,
              dy = 0;
            if (this.cursors.left.isDown) dx = -1;
            if (this.cursors.right.isDown) dx = 1;
            if (this.cursors.up.isDown) dy = -1;
            if (this.cursors.down.isDown) dy = 1;

            if ((dx !== lastDx || dy !== lastDy) && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "move", dx, dy }));
              lastDx = dx;
              lastDy = dy;
            }

            const dt = delta / 1000;
            players.forEach((p, id) => {
              if (id === myId) {
                p.obj.x += dx * SPEED * dt;
                p.obj.y += dy * SPEED * dt;
                p.obj.x = Math.max(HALF, Math.min(WIDTH - HALF, p.obj.x));
                p.obj.y = Math.max(HALF, Math.min(HEIGHT - HALF, p.obj.y));
                p.obj.x += (p.x - p.obj.x) * 0.1;
                p.obj.y += (p.y - p.obj.y) * 0.1;
              } else {
                const lerp = Math.min(1, 10 * dt);
                p.obj.x += (p.x - p.obj.x) * lerp;
                p.obj.y += (p.y - p.obj.y) * lerp;
              }
            });
          },
        },
      });
    </script>
  </body>
</html>
