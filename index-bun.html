<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>Phaser Multiplayer</title>
  <meta charset="utf-8" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>

<body>
  <script type="module">
    import GameScene from './gameScene.js';

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    globalThis.ws = new WebSocket(`${protocol}//${location.host}/ws`);

    globalThis.players = new Map();
    globalThis.myId = null;
    globalThis.lastDx = 0;
    globalThis.lastDy = 0;
    globalThis.SPEED = 150;
    globalThis.RENDER_DELAY_MS = 100;

    globalThis.ws.onopen = () => {
      console.log("WebSocket connected");
    };

    globalThis.ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      switch (data.type) {
        case "connected":
          globalThis.myId = data.id;
          globalThis.ws.send(JSON.stringify({ type: "join", room: "room-1" }));
          break;

        case "state": {
          const now = Date.now();
          data.players.forEach((p) => {
            if (!globalThis.players.has(p.id)) {
              globalThis.players.set(p.id, {
                prev: { x: p.x, y: p.y, t: now - 50 },
                curr: { x: p.x, y: p.y, t: now },
              });
              return;
            }

            const pl = globalThis.players.get(p.id);
            pl.prev = pl.curr;
            pl.curr = { x: p.x, y: p.y, t: now };
          });
          break;
        }
      }
    };

    globalThis.ws.onclose = () => {
      console.log("WebSocket disconnected");
    };

    const mapImage = new Image();
    mapImage.src = 'mapa_redimensionado.jpg';
    mapImage.onload = () => {
      globalThis.game = new Phaser.Game({
        type: Phaser.AUTO,
        width: globalThis.innerWidth - 20,
        height: globalThis.innerHeight - 20,
        center: true,
        backgroundColor: "#1e1e1e",
        scene: [GameScene],
      });
    };
  </script>
</body>

</html>
