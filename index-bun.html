<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>

<body>
  <script type="module">
    import GameScene from './gameScene.js';

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    window.ws = new WebSocket(`${protocol}//${location.host}/ws`);

    window.players = new Map();
    window.myId = null;
    window.lastDx = 0;
    window.lastDy = 0;
    window.SPEED = 150;
    window.RENDER_DELAY_MS = 100;

    window.ws.onopen = () => {
      console.log("WebSocket connected");
    };

    window.ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      switch (data.type) {
        case "connected":
          window.myId = data.id;
          window.ws.send(JSON.stringify({ type: "join", room: "room-1" }));
          break;

        case "state": {
          const now = Date.now();
          data.players.forEach((p) => {
            if (!window.players.has(p.id)) {
              window.players.set(p.id, {
                prev: { x: p.x, y: p.y, t: now - 50 },
                curr: { x: p.x, y: p.y, t: now },
              });
              return;
            }

            const pl = window.players.get(p.id);
            pl.prev = pl.curr;
            pl.curr = { x: p.x, y: p.y, t: now };
          });
          break;
        }
      }
    };

    window.ws.onclose = () => {
      console.log("WebSocket disconnected");
    };

    const mapImage = new Image();
    mapImage.src = 'mapa_redimensionado.jpg';
    mapImage.onload = () => {
      const MAP_WIDTH = mapImage.width;
      const MAP_HEIGHT = mapImage.height;

      new Phaser.Game({
        type: Phaser.AUTO,
        width: '80%',
        height: '80%',
        backgroundColor: "#1e1e1e",
        scene: [GameScene],
      });
    };
  </script>
</body>

</html>
